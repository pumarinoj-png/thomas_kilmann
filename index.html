        }

            height: 100%;

            transition: width 0.3s ease;
        }

        .question-number {

            margin-bottom: 20px;

            gap: 15px;
        }

        .option-button {

            border-radius: 10px;
            background: white;
            cursor: pointer;
            transition: all 0.3s ease;
            text-align: left;
            font-size: 1em;
            line-height: 1.5;
        }

        .option-button:hover {
            border-color: #667eea;
            background: #f8f8f8;
            transform: translateX(5px);
        }

        .option-button.selected {
            border-color: #667eea;
            background: linear-gradient(135deg, rgba(102, 126, 234, 0.1) 0%, rgba(118, 75, 162, 0.1) 100%);

        }

        .option-letter {
            font-weight: bold;
            color: #667eea;
            margin-right: 15px;
        }

        .button-group {

            border-radius: 8px;
            cursor: pointer;

            font-weight: 600;
        }

        .btn-primary {
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            color: white;
            min-width: 150px;
        }

        .btn-primary:hover:not(:disabled) {

        .btn-primary:disabled {

</head>
<body>

        // ============ DEFINICIÓN DE ESTILOS ============
        const styles = {
            Competir: { color: '#EF4444', foco_propio: 'Muy alto', foco_otro: 'Bajo', emoji: '🔴' },
            Colaborar: { color: '#10B981', foco_propio: 'Alto', foco_otro: 'Alto', emoji: '🟢' },
            Transar: { color: '#F59E0B', foco_propio: 'Medio', foco_otro: 'Medio', emoji: '🟠' },
            Evadir: { color: '#6366F1', foco_propio: 'Bajo', foco_otro: 'Bajo', emoji: '🔵' },
            Acomodar: { color: '#8B5CF6', foco_propio: 'Bajo', foco_otro: 'Alto', emoji: '🟣' }
        };

        let userResponses = {};
        let currentQuestionIndex = 0;
        let chartInstance = null;

        function init() {
            document.getElementById('totalQuestions').textContent = questions.length;
            displayQuestion(0);
        }

        function displayQuestion(index) {
            if (index < 0 || index >= questions.length) return;

            currentQuestionIndex = index;
            const question = questions[index];

            document.getElementById('currentQuestion').textContent = index + 1;
            document.getElementById('questionNumber').textContent = question.id;
            document.getElementById('questionText').textContent = `¿Cuál de las siguientes afirmaciones te describe mejor?`;
            document.getElementById('optionAText').textContent = question.a.text;
            document.getElementById('optionBText').textContent = question.b.text;

            const progress = ((index + 1) / questions.length) * 100;
            document.getElementById('progressFill').style.width = progress + '%';

            const optionA = document.getElementById('optionA');
            const optionB = document.getElementById('optionB');
            optionA.classList.remove('selected');
            optionB.classList.remove('selected');

            const isAnswered = userResponses[question.id];
            if (userResponses[question.id] === 'a') optionA.classList.add('selected');
            if (userResponses[question.id] === 'b') optionB.classList.add('selected');

            document.getElementById('prevBtn').disabled = index === 0;
        }

        function selectOption(option) {
            const question = questions[currentQuestionIndex];
            userResponses[question.id] = option;

            const optionA = document.getElementById('optionA');
            const optionB = document.getElementById('optionB');
            optionA.classList.remove('selected');
            optionB.classList.remove('selected');

            if (option === 'a') optionA.classList.add('selected');
            if (option === 'b') optionB.classList.add('selected');

            // Si es la última pregunta, mostrar resultados. Si no, avanzar
            if (currentQuestionIndex === questions.length - 1) {
                setTimeout(() => {
                    showResults();
                }, 400);
            } else {
                setTimeout(() => {
                    displayQuestion(currentQuestionIndex + 1);
                }, 400);
            }
        }

        function previousQuestion() {
            if (currentQuestionIndex > 0) {
                displayQuestion(currentQuestionIndex - 1);
            }
        }

                Transar: 0,

                const questionId = parseInt(qId);
                const option = userResponses[qId];
                const question = questions.find(q => q.id === questionId);

                if (question) {
                    const style = option === 'a' ? question.a.style : question.b.style;
                    results[style]++;
                }
            });

            return results;
        }

        function displayChart(results) {
            const canvas = document.getElementById('resultsChart');
            const ctx = canvas.getContext('2d');

            if (chartInstance) {
                chartInstance.destroy();
            }

            const colors = {
                Competir: '#EF4444',
                Colaborar: '#10B981',
                Transar: '#F59E0B',
                Evadir: '#6366F1',
                Acomodar: '#8B5CF6'
            };

            const referenceLinesPlugin = {
                id: 'referenceLinesPlugin',
                afterDraw(chart) {
                    const ctx = chart.ctx;
                    const yAxis = chart.scales.y;
                    const left = chart.chartArea.left;
                    const right = chart.chartArea.right;

                    // Definir las zonas de color
                    const zones = [
                        { min: 0, max: 5, color: 'rgba(239, 68, 68, 0.10)' },
                        { min: 5, max: 7, color: 'rgba(34, 197, 94, 0.12)' },
                        { min: 7, max: 12, color: 'rgba(59, 130, 246, 0.10)' }
                    ];

                    // Dibujar zonas de fondo sin bordes
                    zones.forEach(zone => {
                        const yMin = yAxis.getPixelForValue(zone.max);
                        const yMax = yAxis.getPixelForValue(zone.min);
                        const height = yMax - yMin;

                        ctx.save();
                        ctx.fillStyle = zone.color;
                        ctx.fillRect(left, yMin, right - left, height);
                        ctx.restore();
                    });

                    // Definir los niveles con sus rangos
                    const levels = [
                        { label: 'Muy Bajo', position: 1 },
                        { label: 'Bajo', position: 3.5 },
                        { label: 'Promedio', position: 6 },
                        { label: 'Alto', position: 8.5 },
                        { label: 'Muy Alto', position: 11 }
                    ];

                    // Dibujar textos de nivel rotados 90 grados en el eje Y
                    levels.forEach(level => {
                        const y = yAxis.getPixelForValue(level.position);
                        
                        ctx.save();
                        ctx.fillStyle = 'rgba(100, 100, 100, 0.5)';
                        ctx.font = '10px Arial';
                        
                        // Posicionar y rotar el texto 90 grados
                        ctx.translate(left - 35, y);
                        ctx.rotate(-Math.PI / 2);
                        ctx.textAlign = 'center';
                        ctx.fillText(level.label, 0, 0);
                        
                        ctx.restore();
                    });
                }
            };

            // Plugin para mostrar valores encima de las barras
            const dataLabelsPlugin = {
                id: 'dataLabelsPlugin',
                afterDatasetsDraw(chart) {
                    chart.data.datasets.forEach((dataset, i) => {
                        const meta = chart.getDatasetMeta(i);
                        meta.data.forEach((bar, index) => {
                            const data = dataset.data[index];
                            const x = bar.x;
                            const y = bar.y;

                            const ctx = chart.ctx;
                            ctx.save();
                            ctx.fillStyle = '#333';
                            ctx.font = 'bold 12px Arial';
                            ctx.textAlign = 'center';
                            ctx.fillText(data, x, y - 8);
                            ctx.restore();
                        });
                    });
                }
            };

            chartInstance = new Chart(ctx, {
                type: 'bar',
                data: {
                    labels: Object.keys(results),
                    datasets: [{
                        label: 'Puntuación',
                        data: Object.values(results),
                        backgroundColor: Object.keys(results).map(style => colors[style]),
                        borderRadius: 8,
                        borderSkipped: false
                    }]
                },
                options: {
                    responsive: true,
                    maintainAspectRatio: false,
                    plugins: { legend: { display: false } },
                    scales: {
                        y: {
                            beginAtZero: true,
                            max: 12,
                            ticks: { stepSize: 1 }
                        }
                    }
                },
                plugins: [referenceLinesPlugin, dataLabelsPlugin]
            });
        }

        function descargarPDF() {

                alert('Error: No se pueden encontrar los resultados');
                return;
            }
            
            const originalText = document.querySelector('.btn-success').textContent;
            document.querySelector('.btn-success').textContent = '⏳ Generando PDF...';
            document.querySelector('.btn-success').disabled = true;
            
            setTimeout(() => {
                const opt = {
                    margin: [10, 10, 10, 10],
                    filename: 'Test-Thomas-Kilmann-Resultados.pdf',
                    image: { type: 'jpeg', quality: 0.95 },
                    html2canvas: { 
                        scale: 2.5,
                        useCORS: true,
                        allowTaint: true,
                        backgroundColor: '#ffffff',
                        logging: false,
                        windowHeight: element.scrollHeight,
                        windowWidth: 900,
                        timeout: 15000,
                        letterRendering: true
                    },
                    jsPDF: { 
                        orientation: 'portrait', 
                        unit: 'mm', 
                        format: 'a4',
                        compress: false
                    },
                    pagebreak: { mode: 'avoid-all', before: '.interpretation-item', after: '.tip-card' }
                };
                
                html2pdf()
                    .set(opt)
                    .from(element)
                    .save()
                    .then(() => {
                        document.querySelector('.btn-success').textContent = originalText;
                        document.querySelector('.btn-success').disabled = false;
                    })
                    .catch(error => {
                        console.error('Error:', error);
                        document.querySelector('.btn-success').textContent = originalText;
                        document.querySelector('.btn-success').disabled = false;
                        alert('Problema al generar PDF. Por favor intenta de nuevo.');
                    });
            }, 1000);
        }
